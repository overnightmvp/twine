<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twine Profile - Theme Tester</title>

    <!-- Switch between themes by changing the href below -->
    <link rel="stylesheet" href="1-neobrutalism.css" id="theme-css">

    <style>
        /* Theme Switcher UI */
        .theme-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            z-index: 9999;
        }

        .theme-switcher select {
            padding: 8px 12px;
            font-size: 14px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
        }

        .theme-switcher label {
            color: white;
            font-size: 12px;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <!-- Theme Switcher -->
    <div class="theme-switcher">
        <label for="theme-select">Theme:</label>
        <select id="theme-select">
            <option value="0-original.css">0. Original (Backend Default)</option>
            <option value="1-neobrutalism.css">1. Neo Brutalism</option>
            <option value="2-retro-gaming.css">2. Retro Gaming</option>
            <option value="3-geometric-blue.css">3. Geometric Blue</option>
            <option value="4-linkedin.css">4. LinkedIn</option>
            <option value="5-Github.css">5. GitHub</option>
            <option value="6-whatsapp.css">6. WhatsApp Dark</option>
        </select>
    </div>

                                    </div>
                                </div>
                            </div>

            </div>
        </div>
    </div>

    <script>
        // Theme Switcher Logic
        document.getElementById('theme-select').addEventListener('change', function() {
            const themeLink = document.getElementById('theme-css');
            themeLink.href = this.value;

            // Force reload by removing and re-adding
            themeLink.parentNode.removeChild(themeLink);
            setTimeout(() => {
                document.head.appendChild(themeLink);
            }, 10);
        });
    </script>
</body>
</html>
